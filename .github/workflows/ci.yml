name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, json
          tools: composer:v2
          coverage: none

      - name: Remove local path repository for CI
        run: |
          jq 'del(.repositories)' composer.json > composer.tmp && mv composer.tmp composer.json
          rm -f composer.lock
          
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Check code style with Pint
        run: ./vendor/bin/pint --test

      - name: Run Rector
        run: ./vendor/bin/rector --dry-run

      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse --memory-limit=512M

      - name: Run tests
        run: ./vendor/bin/pest

  auto-release:
    needs: quality
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest tag
        id: latest_tag
        run: |
          LATEST=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "tag=$LATEST" >> $GITHUB_OUTPUT

      - name: Calculate next version
        id: next_version
        run: |
          LATEST="${{ steps.latest_tag.outputs.tag }}"
          # Remove v prefix
          VERSION=${LATEST#v}
          # Split into parts
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          # Bump patch
          PATCH=$((PATCH + 1))
          NEXT="v${MAJOR}.${MINOR}.${PATCH}"
          echo "version=$NEXT" >> $GITHUB_OUTPUT

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.next_version.outputs.version }}
          git push origin ${{ steps.next_version.outputs.version }}
